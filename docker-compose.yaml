services:
  mongo:
    image: mongo:7
    container_name: logarys-console-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: logarys
    volumes:
      - mongo-data:/data/db
    networks:
      - logarys

  nats:
    image: nats:2.11-alpine
    container_name: logarys-console-nats
    restart: unless-stopped
    command:
      - "-js"
      - "-m"
      - "8222"
      - "-sd"
      - "/data"
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    networks:
      - logarys

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: logarys/console-manager:latest
    container_name: logarys-console-manager
    restart: unless-stopped
    depends_on:
      - mongo
      - nats
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      APP_HOST: "0.0.0.0"
      APP_PORT: "3000"

      MONGODB_URI: "mongodb://mongo:27017"
      MONGODB_DATABASE: "logarys"

      NATS_URL: "nats://nats:4222"

      QUERY_ADAPTERS_DIR: "/var/lib/logarys/query-adapters"

      LOGARYS_ENABLE_TEST_DATA_ENDPOINTS: true

      JWT_SECRET: "change-this-secret"
      JWT_EXPIRES_IN_SECONDS: "43200"

      ADMIN_INIT_ENABLED: "true"
      ADMIN_EMAIL: "admin@logarys.local"
      ADMIN_PASSWORD: "change-me-password"
      ADMIN_NAME: "Administrator"
    volumes:
      - query-adapters:/var/lib/logarys/query-adapters
    networks:
      - logarys

volumes:
  mongo-data:
  nats-data:
  query-adapters:

networks:
  logarys:
    driver: bridge
